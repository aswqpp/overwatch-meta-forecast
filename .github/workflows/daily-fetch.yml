name: Daily data fetch

on:
  schedule:
    # KST 05:00 = UTC 20:00 (전날)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch daily data
        run: pnpm fetch:daily

      - name: Commit and push snapshot data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "data: snapshots $(date -u +%Y-%m-%d)"
            git push
          else
            echo "변경된 데이터 없음, 커밋 건너뜀"
          fi
